{% extends "base.html" %}
{% block title %}Create account | Common Goods{% endblock %}
{% block content %}
<section class="form-page">
  <p class="eyebrow">Join the shop</p>
  <h1>Create an account</h1>
  <form class="account-form" method="post">
    <label for="name">Your name</label>
    <input id="name" name="name" type="text" autocomplete="name" required>
    <label for="email">Email address</label>
    <input id="email" name="email" type="email" autocomplete="email" required>
    <label for="password">Password</label>
    <input id="password" name="password" type="password" minlength="8" autocomplete="new-password" required>
    <button class="button button-dark button-wide" type="submit">Create account</button>
  </form>
  <p class="form-note">Already registered? <a href="{{ url_for('login') }}">Log in</a></p>
</section>
{% endblock %}
